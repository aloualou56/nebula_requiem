# Builds the APK on every push to main, on pull requests, and on demand (Actions → Build APK → Run workflow).
# The APK is attached to each run as an artifact: open the run and download "nebula-requiem-apk".
# With the signing secrets set (see "Set up release signing") every build installs over the previous one.
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Signs with the release key when the repository has these secrets (Settings → Secrets and
      # variables → Actions): KEYSTORE_BASE64 (the .jks file, base64-encoded), KEYSTORE_PASSWORD,
      # KEY_ALIAS and KEY_PASSWORD. Without them the APK is signed with a temporary debug key.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set, so this APK is signed with a temporary debug key and won't install over other builds."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "Signing with the release key."

      - name: Build the release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: nebula-requiem-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
