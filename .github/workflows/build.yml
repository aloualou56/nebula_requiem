# Builds the APK on every push to main, on pull requests, and on demand (Actions → Build APK → Run workflow).
# The APK is attached to each run as an artifact: open the run and download "nebula-requiem-apk".
# Without keystore.properties the release build is signed with a debug key, so it can be installed for testing.
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: nebula-requiem-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
